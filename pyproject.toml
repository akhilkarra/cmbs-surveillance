[project]
name = "cmbs-surveillance"
version = "0.1.0"
description = "Public CMBS filings turned into a verified, point-in-time surveillance panel."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "defusedxml>=0.7.1",
    "fastapi>=0.162.0",
    "lxml>=6",
    "pandera[polars]>=0.34",
    "pgvector>=0.5.1",
    "polars>=2.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "sqlalchemy>=2.1.6",
    "typer>=0.20",
    "uvicorn>=0.38",
]

[project.scripts]
cmbs = "cmbs.cli:main"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "behavex>=4.6.8",
    "httpx2>=2.16.0",
    "mutmut>=3.8.0",
    "playwright>=1.64.1",
    "pytest>=8,<9.2",  # mutmut 3.8.0 reads item._nodeid, which pytest 9.2.0 removed
    "pytest-cov>=7.1.0",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmbs"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Vendored skills and local-only material are not ours to lint.
extend-exclude = [".claude", "private"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.alembic]
# Migrations ship inside the package so the `api` container can run them.
# The database URL comes from DATABASE_URL (see src/cmbs/db/migrations/env.py).
script_location = "%(here)s/src/cmbs/db/migrations"
file_template = "%%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s"
prepend_sys_path = ["."]

[[tool.alembic.post_write_hooks]]
name = "ruff_check"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[tool.mutmut]
# `uv run mutmut run`, then `uv run mutmut results` and `uv run mutmut show <name>`.
# Migrations are declarative and tested directly against Postgres (tests/test_migrations.py).
source_paths = ["src/cmbs"]
# Test infrastructure (scratch databases, the fixture world) is not product logic.
do_not_mutate = ["src/cmbs/db/migrations/*", "src/cmbs/testing/*"]
pytest_add_cli_args_test_selection = ["tests"]
# Tests of the developer tools load them from tools/, and the dashboard harness tests import
# the scenario steps from features/.
also_copy = ["tools", "features"]
# Fork each mutant from a clean server process, not from mutmut's main process: the main
# process has run the suite, which starts Polars' thread pool, and a child forked from it
# hangs on its first Polars query (Pandera checks run one), so every such mutant timed out.
process_isolation = "forkserver"

[tool.basedpyright]
# basedpyright is pyright with its own Node binary, so nothing is installed on the host.
# "standard" is pyright's default strictness; tighten per module as code settles.
include = ["src", "tests", "tools", "features"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.coverage.run]
source = ["cmbs"]
branch = true
omit = ["*/cmbs/db/migrations/*"]

[tool.coverage.report]
# The floor is the score on 2026-10-28 (55.8%); raise it as tests improve.
fail_under = 55
show_missing = true
skip_covered = true

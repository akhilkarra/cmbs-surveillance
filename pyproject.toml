[project]
name = "cmbs-surveillance"
version = "0.1.0"
description = "Public CMBS filings turned into a verified, point-in-time surveillance panel."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["typer>=0.20"]

[project.scripts]
cmbs = "cmbs.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmbs"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Vendored skills and local-only material are not ours to lint.
extend-exclude = [".claude", "private"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

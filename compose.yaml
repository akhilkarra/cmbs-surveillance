# Local services (grill log Q19, Q20). The credentials are for local development only.
services:
  db:
    # PostgreSQL 18 with pgvector (grill log Q53), pinned by digest.
    image: pgvector/pgvector:pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
    environment:
      POSTGRES_USER: cmbs
      POSTGRES_PASSWORD: cmbs
      POSTGRES_DB: cmbs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmbs -d cmbs"]
      interval: 2s
      timeout: 3s
      retries: 15

  web:
    # Vite dev server for the React app (grill log Q13, Q19). npm runs here, never on the host:
    # `docker compose run --rm web npm test`.
    image: node:25-alpine@sha256:bdf2cca6fe3dabd014ea60163eca3f0f7015fbd5c7ee1b0e9ccb4ced6eb02ef4
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules

volumes:
  pgdata:
  web_node_modules:

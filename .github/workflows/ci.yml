name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to a commit SHA, with the release it was taken from in the comment.
jobs:
  # Every commit-stage hook in .pre-commit-config.yaml: linters, formatters, type check,
  # spelling, workflow and secret checks.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - run: uvx pre-commit run --all-files --show-diff-on-failure
      # The committed schema the web client is generated from (grill log Q12); the message names
      # the command that regenerates it. tests/test_openapi.py checks the same under pytest.
      - name: web/openapi.json matches the API
        run: uv run python tools/export_openapi.py --check

  # Tests and feature scenarios; `py`, the required check, passes only when they and the Lean
  # proofs passed. Mutation testing runs nightly instead (.github/workflows/mutation.yml, Q89).
  tests:
    runs-on: ubuntu-latest
    services:
      # Same image as compose.yaml, so migrations are tested against the real extensions.
      db:
        image: pgvector/pgvector:pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_USER: cmbs
          POSTGRES_DB: cmbs
          # A throwaway database reachable only inside this job, so no password at all.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmbs -d cmbs"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      # Fails below fail_under in pyproject.toml.
      - name: Tests with coverage
        run: uv run pytest --cov
        env:
          DATABASE_URL: postgresql+psycopg://cmbs@localhost:5432/cmbs
      - name: Chromium for @surface:ui scenarios
        run: uv run playwright install --with-deps chromium
      # The dashboard scenarios serve the built bundle (features/steps/dashboard.py); build it
      # once here, in the same pinned web image the steps use, so they find it fresh.
      - name: Dashboard bundle for @surface:ui scenarios
        run: docker compose run --rm --no-deps web sh -c "npm ci && npm run build"
      # behavex ignores default_tags in behave.ini, so drafts are excluded here explicitly.
      - name: Feature scenarios
        run: uv run behavex -t 'not @draft' --parallel-processes 2 -o output/behavex
        env:
          DATABASE_URL: postgresql+psycopg://cmbs@localhost:5432/cmbs
      - name: Feature files carry a status tag, and approved ones match the manifest and carry approval
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: uv run python tools/check_approved_features.py --range "$BASE..$HEAD"

  # The Lean proofs (grill log Q4). Building lean/ checks every proof; --wfail fails on any
  # warning, and lean/Invariants/Audit.lean fails the build if a theorem rests on an unfinished
  # proof or an axiom beyond Lean's standard three. Then Python is run against the oracle the
  # build produced (Hypothesis differential tests), which must not skip here.
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          lake-package-directory: lean
          build-args: --wfail
          test: false
          lint: false
          use-mathlib-cache: false
      # A proof left open, or compiled code standing in for a proved definition
      # (implemented_by, extern, unsafe), which the axiom audit cannot see.
      - name: No proof is left unchecked in the sources
        run: "! grep -rnwE 'sorry|admit|native_decide|implemented_by|extern|unsafe' lean --include='*.lean'"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - name: Python against the Lean oracle
        run: uv run pytest tests/test_lean_oracle.py tests/test_lean_sources.py
        env:
          CMBS_REQUIRE_LEAN: "1"

  # The required check. It always runs, so a failed or cancelled dependency cannot leave it
  # skipped (a skipped required check counts as passing). It needs the tests and the Lean proofs
  # to have succeeded. Mutation testing runs nightly in .github/workflows/mutation.yml (Q89).
  py:
    needs: [tests, lean]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Tests and the Lean proofs passed
        env:
          TESTS: ${{ needs.tests.result }}
          LEAN: ${{ needs.lean.result }}
        run: |
          echo "tests: $TESTS, lean: $LEAN"
          test "$TESTS" = success
          test "$LEAN" = success

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # orval regenerates the client from the committed schema; any difference, or a file it
      # would add or remove, means the committed client is stale.
      - name: src/generated matches openapi.json
        run: |
          npm run generate
          if [ -n "$(git status --porcelain -- src/generated)" ]; then
            git status --short -- src/generated
            git diff -- src/generated
            echo "::error::web/src/generated is stale against web/openapi.json. Regenerate it with 'docker compose run --rm web npm run generate' and commit it."
            exit 1
          fi
      - run: npm run build
      # Fails below the thresholds in web/vite.config.ts.
      - name: Tests with coverage
        run: npm run test:coverage

  # Compose's api service (Dockerfile): the image builds from the lockfiles and serves the
  # dashboard and the API against the db service, as `docker compose up -d api` does locally.
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - name: Start db and api
        run: docker compose up -d --build --wait db api
      - name: Migrate and seed the fixture users
        run: |
          uv run alembic upgrade head
          uv run python tools/seed_demo.py
        env:
          DATABASE_URL: postgresql+psycopg://cmbs:cmbs@localhost:5432/cmbs
      - name: The dashboard page and its API answer
        run: |
          curl -fsS http://localhost:8000/health/ready
          curl -fsS "http://localhost:8000/?user=pat" | grep -q '<div id="root">'
          curl -fsS -H "X-CMBS-User: pat" http://localhost:8000/dashboard/book | grep -q '"rows":\['
      - name: Service logs
        if: failure()
        run: docker compose logs api db

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to a commit SHA, with the release it was taken from in the comment.
jobs:
  # Every commit-stage hook in .pre-commit-config.yaml: linters, formatters, type check,
  # spelling, workflow and secret checks.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --locked
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  # Tests and feature scenarios. Mutation testing runs alongside when it is on, split across the
  # `mutation` shards; `py`, the required check, passes only when every part that ran passed.
  tests:
    runs-on: ubuntu-latest
    services:
      # Same image as compose.yaml, so migrations are tested against the real extensions.
      db:
        image: pgvector/pgvector:pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_USER: cmbs
          POSTGRES_DB: cmbs
          # A throwaway database reachable only inside this job, so no password at all.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmbs -d cmbs"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --locked
      # Fails below fail_under in pyproject.toml.
      - name: Tests with coverage
        run: uv run pytest --cov
        env:
          DATABASE_URL: postgresql+psycopg://cmbs@localhost:5432/cmbs
      - name: Chromium for @surface:ui scenarios
        run: uv run playwright install --with-deps chromium
      # The dashboard scenarios serve the built bundle (features/steps/dashboard.py); build it
      # once here, in the same pinned web image the steps use, so they find it fresh.
      - name: Dashboard bundle for @surface:ui scenarios
        run: docker compose run --rm --no-deps web sh -c "npm ci && npm run build"
      # behavex ignores default_tags in behave.ini, so drafts are excluded here explicitly.
      - name: Feature scenarios
        run: uv run behavex -t 'not @draft' --parallel-processes 2 -o output/behavex
        env:
          DATABASE_URL: postgresql+psycopg://cmbs@localhost:5432/cmbs
      - name: Feature files carry a status tag, and approved ones match the manifest and carry approval
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: uv run python tools/check_approved_features.py --range "$BASE..$HEAD"

  # Mutation testing in eight parallel shards that together run every mutant exactly once
  # (tools/mutation_shards.py). With a database, so code reached only by database tests is
  # mutation-tested too; every test uses its own scratch database, named per process.
  # Paused (grill log Q76): it runs only while the repository variable MUTATION_TESTING is "on",
  # so turning it back on is `gh variable set MUTATION_TESTING --body on`, with no code change.
  mutation:
    if: vars.MUTATION_TESTING == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    services:
      # Same image as compose.yaml, so migrations are tested against the real extensions.
      db:
        image: pgvector/pgvector:pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_USER: cmbs
          POSTGRES_DB: cmbs
          # A throwaway database reachable only inside this job, so no password at all.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmbs -d cmbs"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --locked
      - name: Mutation testing, one shard of eight
        env:
          DATABASE_URL: postgresql+psycopg://cmbs@localhost:5432/cmbs
          SHARD: ${{ matrix.shard }}
        run: uv run python tools/mutation_shards.py run --shard "$SHARD" --of 8 --max-children 4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: mutants/shard-stats.json
          if-no-files-found: error
          retention-days: 7

  # The required check. It always runs, so a failed or cancelled dependency cannot leave it
  # skipped (a skipped required check counts as passing). It needs the tests to have succeeded
  # and, while mutation testing is on, every shard too, then applies the floor to the shards'
  # combined score. Raise the floor as tests improve; never lower it to make CI pass.
  py:
    needs: [tests, mutation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Tests and, when on, every mutation shard passed
        env:
          TESTS: ${{ needs.tests.result }}
          MUTATION: ${{ needs.mutation.result }}
          MUTATION_TESTING: ${{ vars.MUTATION_TESTING }}
        run: |
          echo "tests: $TESTS, mutation testing: ${MUTATION_TESTING:-off}, mutation shards: $MUTATION"
          test "$TESTS" = success
          if [ "$MUTATION_TESTING" = on ]; then
            test "$MUTATION" = success
          else
            test "$MUTATION" = skipped
          fi
      - if: vars.MUTATION_TESTING == 'on'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: vars.MUTATION_TESTING == 'on'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-shard-*
          path: shard-stats
      - name: Mutation score across all shards
        if: vars.MUTATION_TESTING == 'on'
        run: python3 tools/check_mutation_score.py --min 71 shard-stats/*/shard-stats.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      # Fails below the thresholds in web/vite.config.ts.
      - name: Tests with coverage
        run: npm run test:coverage
      # Fails below the break threshold in web/stryker.config.json. Paused with Python's mutation
      # testing (grill log Q76): it runs only while the repository variable MUTATION_TESTING is "on".
      - name: Mutation score
        if: vars.MUTATION_TESTING == 'on'
        run: npm run mutate

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to a commit SHA, with the release it was taken from in the comment.
jobs:
  # Every commit-stage hook in .pre-commit-config.yaml: linters, formatters, type check,
  # spelling, workflow and secret checks.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --locked
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  py:
    runs-on: ubuntu-latest
    services:
      # Same image as compose.yaml, so migrations are tested against the real extensions.
      db:
        image: pgvector/pgvector:pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_USER: cmbs
          POSTGRES_PASSWORD: cmbs
          POSTGRES_DB: cmbs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmbs -d cmbs"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --locked
      # Fails below fail_under in pyproject.toml.
      - name: Tests with coverage
        run: uv run pytest --cov
        env:
          DATABASE_URL: postgresql+psycopg://cmbs:cmbs@localhost:5432/cmbs
      - name: Chromium for @surface:ui scenarios
        run: uv run playwright install --with-deps chromium
      # behavex ignores default_tags in behave.ini, so drafts are excluded here explicitly.
      - name: Feature scenarios
        run: uv run behavex -t 'not @draft' --parallel-processes 2 -o output/behavex
        env:
          DATABASE_URL: postgresql+psycopg://cmbs:cmbs@localhost:5432/cmbs
      # Raise the floor as tests improve. With a database, so code reached only by database tests
      # is mutation-tested too; every test uses its own scratch database, named per process, and
      # four workers match the runner's cores.
      - name: Mutation score
        env:
          DATABASE_URL: postgresql+psycopg://cmbs:cmbs@localhost:5432/cmbs
        run: |
          uv run mutmut run --max-children 4 > /dev/null
          uv run mutmut export-cicd-stats
          uv run python tools/check_mutation_score.py --min 71
      - name: Feature files carry a status tag, and approved ones match the manifest and carry approval
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: uv run python tools/check_approved_features.py --range "$BASE..$HEAD"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      # Fails below the thresholds in web/vite.config.ts.
      - name: Tests with coverage
        run: npm run test:coverage
      # Fails below the break threshold in web/stryker.config.json.
      - name: Mutation score
        run: npm run mutate

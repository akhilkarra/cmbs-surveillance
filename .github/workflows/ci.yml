name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  py:
    runs-on: ubuntu-latest
    services:
      # Same image as compose.yaml, so migrations are tested against the real extensions.
      db:
        image: pgvector/pgvector:pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_USER: cmbs
          POSTGRES_PASSWORD: cmbs
          POSTGRES_DB: cmbs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmbs -d cmbs"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
        env:
          DATABASE_URL: postgresql+psycopg://cmbs:cmbs@localhost:5432/cmbs
      - name: Chromium for @surface:ui scenarios
        run: uv run playwright install --with-deps chromium
      # behavex ignores default_tags in behave.ini, so drafts are excluded here explicitly.
      - name: Feature scenarios
        run: uv run behavex -t 'not @draft' --parallel-processes 2 -o output/behavex
        env:
          DATABASE_URL: postgresql+psycopg://cmbs:cmbs@localhost:5432/cmbs
      # The floor is the score on 2026-10-27; raise it as tests improve.
      - name: Mutation score
        run: |
          uv run mutmut run > /dev/null
          uv run mutmut export-cicd-stats
          uv run python tools/check_mutation_score.py --min 68
      - name: Feature files carry a status tag, and approved ones match the manifest and carry approval
        run: uv run python tools/check_approved_features.py --range "${{ github.event.pull_request.base.sha || github.event.before }}..${{ github.sha }}"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Fails below the break threshold in web/stryker.config.json.
      - name: Mutation score
        run: npm run mutate
